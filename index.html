<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SHORTR SHARE</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- HERO -->

    <section class="hero">

        <div class="overlay">

            <div class="container text-center">

                <h5 class="subtitle">
                    Wedding Gallery
                </h5>

                <h1 id="coupleName">

                    Asep & Regita

                </h1>

                <p class="date">

                    26 July 2026

                </p>

                <p class="description">

                    Thank you for celebrating our special day.

                    Please download all photos and GIFs below.

                </p>

            </div>

        </div>

    </section>

    <!-- BUTTON -->

    <section class="download-section">

        <div class="container">

            <div class="row g-3">

                <div class="col-md-6">

                    <a href="#"
                       id="photoLink"
                       class="btn btn-gold w-100">

                        DOWNLOAD PHOTO

                    </a>

                </div>

                <div class="col-md-6">

                    <a href="#"
                       id="gifLink"
                       class="btn btn-outline-light w-100">

                        DOWNLOAD GIF

                    </a>

                </div>

            </div>

        </div>

    </section>

    <!-- GALLERY -->

    <section class="gallery-section">

        <div class="container">

            <h2>

                Live Gallery

            </h2>

            <div id="gallery"
                 class="row g-3">

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <footer>

        Powered by

        <strong>

            SHORTR LIVE

        </strong>

    </footer>

<script src="js/app.js"></script>
    <script src="js/gallery.js"></script>

</body>

</html>
